<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Acadêmico | ADS 2026.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #161616;
            --accent: #d4af37;
            --text: #e0e0e0;
            --border: #222;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .landing-container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
            background: var(--card);
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #666;
            margin-bottom: 40px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.8rem;
        }
        .master-btn {
            display: inline-block;
            background: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
            padding: 18px 40px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.1rem;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
        }
        .master-btn:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.4);
            transform: translateY(-3px);
        }
        .footer-note {
            margin-top: 40px;
            font-size: 0.7rem;
            color: #444;
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <p>Análise e Desenvolvimento de Sistemas</p>
        <h1>Portal de Recaps</h1>
        <div style="margin: 40px 0;">
            <a href="./portal/Recap_Master_S1.html" class="master-btn">
                Master Dashboard 2026.1
            </a>
        </div>
        <div class="footer-note">
            Organizado por Jeronimo Silva • Sincronizado com Second Brain
        </div>
    </div>
</body>
</html>
